/*
 * Modulo de consenso Raft (prototipo de TFG). Modelado sobre consensus/clique.
 */

plugins { id 'java' }

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash
      )
  }
}

repositories { mavenCentral() }

// El motor Raft reutilizado del proyecto standalone del TFG no sigue la convencion de Besu
// de marcar todos los parametros como 'final'; se desactiva ese check de estilo solo para
// este modulo en vez de reescribir ~20 ficheros ya verificados por separado.
tasks.withType(JavaCompile).configureEach {
  options.errorprone {
    check('MethodInputParametersMustBeFinal', net.ltgt.gradle.errorprone.CheckSeverity.OFF)
    check('StringSplitter', net.ltgt.gradle.errorprone.CheckSeverity.OFF)
  }
}

dependencies {
  implementation project(':config')
  implementation project(':consensus:common')
  implementation project(':crypto:services')
  implementation project(':datatypes')
  implementation project(':ethereum:api')
  implementation project(':ethereum:blockcreation')
  implementation project(':ethereum:core')
  implementation project(':ethereum:eth')
  implementation project(':ethereum:p2p')
  implementation project(':ethereum:rlp')
  implementation project(':evm')
  implementation project(':services:kvstore')
  implementation project(':util')

  implementation 'com.google.guava:guava'
  implementation 'io.vertx:vertx-core'
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'io.consensys.tuweni:tuweni-units'

  testImplementation project(path: ':consensus:common', configuration: 'testArtifacts')
  testImplementation project(path: ':crypto:services', configuration: 'testSupportArtifacts')
  testImplementation project(':metrics:core')
  testImplementation project(path: ':ethereum:core', configuration: 'testSupportArtifacts')
  testImplementation project(':testutil')

  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}
